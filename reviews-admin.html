<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Approvals — Dave Penquite Carpentry</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#1a1a14;--gold:#8B6D1A;--green:#4A7030;--sage:#7AAA58;--cream:#FAFAF5;--warm:#F2EFE8;--border:#E0DDD6;--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",Arial,sans-serif}
body{font-family:var(--sans);background:var(--warm);color:var(--dark);line-height:1.6;padding:clamp(20px,4vw,48px)}
.wrap{max-width:820px;margin:0 auto}
h1{font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:400;margin-bottom:6px}
h1 em{font-style:italic;color:var(--gold)}
.lead{color:#666;margin-bottom:32px;font-size:15px}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{background:#fff;border:2px solid var(--border);padding:9px 20px;border-radius:40px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);color:#555;transition:all .2s}
.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.empty{background:#fff;border:2px dashed var(--border);border-radius:12px;padding:48px;text-align:center;color:#999}
.review{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px 26px;margin-bottom:16px}
.review-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.review-name{font-size:16px;font-weight:700}
.review-loc{font-size:13px;color:#888}
.review-stars{color:var(--gold);font-size:17px;letter-spacing:2px}
.review-text{font-family:var(--serif);font-size:19px;font-style:italic;color:var(--dark);line-height:1.6;margin:12px 0 18px}
.review-date{font-size:12px;color:#aaa;margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:none;padding:10px 20px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:opacity .2s}
.btn:hover{opacity:.88}
.btn-approve{background:var(--green);color:#fff}
.btn-reject{background:#fff;color:#A04030;border:2px solid #E5C5BD}
.btn-remove{background:#fff;color:#888;border:2px solid var(--border)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px}
.badge-live{background:#E8F0DD;color:var(--green)}
.tag-instructions{background:#FFF8E8;border:1px solid #E8D9A8;border-radius:10px;padding:16px 20px;margin-bottom:28px;font-size:14px;color:#6B5818;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>Review <em>Approvals</em></h1>
  <p class="lead">New reviews land here first. Approve the ones you want shown on your website.</p>

  <div class="tag-instructions">
    <strong>How this works:</strong> When a customer submits a review, it appears under &ldquo;Pending&rdquo; below.
    Approve it and it automatically shows on your website&rsquo;s reviews section. Bookmark this page &mdash; it&rsquo;s just for you.
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="pending">Pending</button>
    <button class="tab" data-tab="approved">Approved (live)</button>
  </div>

  <div id="list"></div>
</div>

<script>
let currentTab = 'pending';

async function loadReviews() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  let keys = [];
  try {
    const res = await window.storage.list('review:', true);
    keys = res && res.keys ? res.keys : [];
  } catch (e) { keys = []; }

  const reviews = [];
  for (const k of keys) {
    try {
      const r = await window.storage.get(k, true);
      if (r && r.value) reviews.push(JSON.parse(r.value));
    } catch (e) {}
  }
  reviews.sort((a,b) => new Date(b.date) - new Date(a.date));
  const filtered = reviews.filter(r => currentTab === 'pending' ? r.status === 'pending' : r.status === 'approved');

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">No ' + currentTab + ' reviews yet.</div>';
    return;
  }

  for (const r of filtered) {
    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
    const div = document.createElement('div');
    div.className = 'review';
    div.innerHTML = `
      <div class="review-top">
        <div>
          <div class="review-name">${esc(r.name)} ${r.status==='approved'?'<span class="badge badge-live">Live</span>':''}</div>
          <div class="review-loc">${esc(r.loc||'')}</div>
        </div>
        <div class="review-stars">${stars}</div>
      </div>
      <div class="review-text">&ldquo;${esc(r.text)}&rdquo;</div>
      <div class="actions">
        ${r.status==='pending'
          ? `<button class="btn btn-approve" onclick="setStatus('${r.id}','approved')">✓ Approve &amp; publish</button>
             <button class="btn btn-reject" onclick="removeReview('${r.id}')">Reject</button>`
          : `<button class="btn btn-remove" onclick="setStatus('${r.id}','pending')">Unpublish</button>
             <button class="btn btn-reject" onclick="removeReview('${r.id}')">Delete</button>`}
      </div>
      <div class="review-date">Submitted ${new Date(r.date).toLocaleDateString()}</div>`;
    list.appendChild(div);
  }
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function setStatus(id, status) {
  try {
    const r = await window.storage.get('review:'+id, true);
    if (r && r.value) {
      const rev = JSON.parse(r.value);
      rev.status = status;
      await window.storage.set('review:'+id, JSON.stringify(rev), true);
    }
  } catch(e){ console.error(e); }
  loadReviews();
}

async function removeReview(id) {
  if (!confirm('Remove this review permanently?')) return;
  try { await window.storage.delete('review:'+id, true); } catch(e){}
  loadReviews();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    loadReviews();
  });
});

loadReviews();
</script>
</body>
</html>
